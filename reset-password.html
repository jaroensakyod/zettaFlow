<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EliteFlow — ตั้งรหัสผ่านใหม่</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Noto+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07050f;
  --surface: #0e0a1a;
  --surface2: #150f25;
  --border: #2a1a4a;
  --accent2: #7c3aed;
  --accent3: #a855f7;
  --teal: #2dd4bf;
  --green: #4ade80;
  --red: #f87171;
  --text: #f3e8ff;
  --muted: #6b4fa0;
  --muted2: #9d7ec9;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans Thai',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden;}

body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:0;}

.global-bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 80% 60% at 15% 30%,rgba(124,58,237,0.18) 0%,transparent 60%),
  radial-gradient(ellipse 60% 80% at 85% 70%,rgba(45,212,191,0.07) 0%,transparent 60%),var(--bg);}
.global-grid{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(168,85,247,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(168,85,247,0.04) 1px,transparent 1px);
  background-size:60px 60px;mask-image:radial-gradient(ellipse at center,black 20%,transparent 80%);}

.card{position:relative;z-index:1;width:100%;max-width:400px;background:rgba(14,10,26,0.97);border:1px solid rgba(168,85,247,0.2);border-radius:24px;padding:40px 36px;box-shadow:0 0 0 1px rgba(168,85,247,0.05) inset,0 40px 80px rgba(0,0,0,0.6),0 0 80px rgba(124,58,237,0.1);animation:fadeUp 0.4s ease;}

@keyframes fadeUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes pulse{0%,100%{opacity:0.6;box-shadow:0 0 20px rgba(168,85,247,0.3);}50%{opacity:1;box-shadow:0 0 32px rgba(168,85,247,0.6);}}
@keyframes checkPop{0%{transform:scale(0) rotate(-10deg);}70%{transform:scale(1.2) rotate(3deg);}100%{transform:scale(1) rotate(0deg);}}

.logo{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,var(--accent2),var(--teal));display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:20px;font-weight:800;color:white;margin:0 auto 16px;border:2px solid rgba(168,85,247,0.4);animation:pulse 3s ease-in-out infinite;position:relative;overflow:hidden;}
.logo img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover;}

.title{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;text-align:center;margin-bottom:4px;}
.title span{background:linear-gradient(135deg,var(--accent3),var(--teal));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.subtitle{font-size:12px;color:var(--muted2);text-align:center;margin-bottom:8px;}

.badge{display:flex;align-items:center;gap:6px;background:rgba(168,85,247,0.08);border:1px solid rgba(168,85,247,0.2);border-radius:20px;padding:5px 14px;font-size:11px;color:var(--muted2);font-family:'Syne',sans-serif;width:fit-content;margin:0 auto 28px;}

.form-label{display:block;font-size:10px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px;font-family:'Syne',sans-serif;}
.input-wrap{position:relative;margin-bottom:14px;}
.form-input{width:100%;padding:12px 42px 12px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'Noto Sans Thai',sans-serif;font-size:13px;outline:none;transition:border-color 0.2s,box-shadow 0.2s;}
.form-input:focus{border-color:var(--accent3);box-shadow:0 0 0 3px rgba(168,85,247,0.12);}
.form-input::placeholder{color:rgba(107,79,160,0.4);}
.eye-btn{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:2px;line-height:1;}
.eye-btn:hover{color:var(--muted2);}

.strength-bar{height:3px;border-radius:2px;background:var(--border);margin-top:-8px;margin-bottom:14px;overflow:hidden;}
.strength-fill{height:100%;border-radius:2px;transition:width 0.3s,background 0.3s;width:0%;}
.strength-label{font-size:10px;color:var(--muted);margin-top:4px;text-align:right;margin-bottom:10px;}

.submit-btn{width:100%;padding:13px;background:linear-gradient(135deg,var(--accent2),var(--accent3));border:none;border-radius:10px;color:white;font-family:'Syne',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:all 0.2s;box-shadow:0 4px 20px rgba(124,58,237,0.35);letter-spacing:0.5px;}
.submit-btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 8px 28px rgba(124,58,237,0.5);}
.submit-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;}

.msg{font-size:12px;text-align:center;margin-top:10px;min-height:18px;}
.msg.error{color:var(--red);}
.msg.success{color:var(--green);}

/* SUCCESS STATE */
.success-state{display:none;text-align:center;}
.success-icon{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--green),var(--teal));display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 20px;animation:checkPop 0.5s ease forwards;box-shadow:0 0 30px rgba(74,222,128,0.3);}
.success-title{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;margin-bottom:8px;background:linear-gradient(135deg,var(--green),var(--teal));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.success-sub{font-size:13px;color:var(--muted2);line-height:1.7;margin-bottom:24px;}
.go-login-btn{width:100%;padding:13px;background:linear-gradient(135deg,var(--accent2),var(--accent3));border:none;border-radius:10px;color:white;font-family:'Syne',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:all 0.2s;box-shadow:0 4px 20px rgba(124,58,237,0.35);}
.go-login-btn:hover{transform:translateY(-1px);box-shadow:0 8px 28px rgba(124,58,237,0.5);}

/* ERROR STATE */
.error-state{display:none;text-align:center;}
.error-icon{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--red),#f43f5e);display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 20px;box-shadow:0 0 30px rgba(248,113,113,0.3);}
.error-title{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;margin-bottom:8px;color:var(--red);}
.error-sub{font-size:13px;color:var(--muted2);line-height:1.7;margin-bottom:24px;}

.spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,0.2);border-top-color:white;border-radius:50%;animation:spin 0.6s linear infinite;display:inline-block;vertical-align:middle;margin-right:6px;}

/* LOADING overlay */
.page-loading{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100;flex-direction:column;gap:16px;transition:opacity 0.4s;}
.page-loading-logo{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--accent2),var(--teal));display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:18px;font-weight:800;color:white;animation:pulse 2s ease-in-out infinite;position:relative;overflow:hidden;}
.page-loading-logo img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover;}
.loading-bar{width:160px;height:2px;background:var(--surface2);border-radius:2px;overflow:hidden;}
.loading-fill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent3),var(--teal));animation:load 1s ease forwards;}
@keyframes load{from{width:0}to{width:100%}}
</style>
</head>
<body>
<div class="global-bg"></div>
<div class="global-grid"></div>

<!-- PAGE LOADING -->
<div class="page-loading" id="pageLoading">
  <div class="page-loading-logo">
    EF
    <img src="logo.png" onerror="this.style.display='none'">
  </div>
  <div class="loading-bar"><div class="loading-fill"></div></div>
</div>

<div class="card" id="mainCard" style="display:none;">
  <div class="logo">
    EF
    <img src="logo.png" onerror="this.style.display='none'">
  </div>
  <div class="title">Elite<span>Flow</span></div>
  <div class="subtitle">ตั้งรหัสผ่านใหม่ของคุณ</div>
  <div class="badge">🔑 RESET PASSWORD</div>

  <!-- FORM -->
  <div id="formState">
    <label class="form-label">รหัสผ่านใหม่</label>
    <div class="input-wrap">
      <input type="password" class="form-input" id="newPass" placeholder="อย่างน้อย 6 ตัวอักษร" oninput="checkStrength()" onkeydown="if(event.key==='Enter')doReset()">
      <button class="eye-btn" onclick="toggleEye('newPass','eye1')" id="eye1">👁️</button>
    </div>
    <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
    <div class="strength-label" id="strengthLabel"></div>

    <label class="form-label">ยืนยันรหัสผ่านใหม่</label>
    <div class="input-wrap">
      <input type="password" class="form-input" id="confirmPass" placeholder="พิมพ์รหัสผ่านอีกครั้ง" onkeydown="if(event.key==='Enter')doReset()">
      <button class="eye-btn" onclick="toggleEye('confirmPass','eye2')" id="eye2">👁️</button>
    </div>

    <button class="submit-btn" id="submitBtn" onclick="doReset()">ตั้งรหัสผ่านใหม่ →</button>
    <div class="msg" id="msgEl"></div>
  </div>

  <!-- SUCCESS -->
  <div class="success-state" id="successState">
    <div class="success-icon">✅</div>
    <div class="success-title">เปลี่ยนรหัสผ่านสำเร็จ!</div>
    <div class="success-sub">รหัสผ่านใหม่ของคุณถูกบันทึกแล้ว<br>สามารถเข้าสู่ระบบได้เลยค่ะ</div>
    <button class="go-login-btn" onclick="window.location.href='index.html'">เข้าสู่ระบบ →</button>
  </div>

  <!-- ERROR -->
  <div class="error-state" id="errorState">
    <div class="error-icon">⚠️</div>
    <div class="error-title" id="errorTitle">ลิงก์หมดอายุแล้ว</div>
    <div class="error-sub" id="errorSub">ลิงก์นี้ถูกใช้ไปแล้วหรือหมดอายุ<br>กรุณาขอลิงก์ใหม่อีกครั้งค่ะ</div>
    <button class="go-login-btn" onclick="window.location.href='index.html'">กลับหน้าเข้าสู่ระบบ</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, verifyPasswordResetCode, confirmPasswordReset } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey:"AIzaSyCcNc3DQ_iw0fcTyvgrXQcj3S15CNlyHGU",
  authDomain:"elitflow-38bc4.firebaseapp.com",
  projectId:"elitflow-38bc4",
  storageBucket:"elitflow-38bc4.firebasestorage.app",
  messagingSenderId:"697101909670",
  appId:"1:697101909670:web:afa2071ba0ca64dbba7e67"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// Get oobCode from URL
const params = new URLSearchParams(window.location.search);
const oobCode = params.get('oobCode');
const mode = params.get('mode');

async function init() {
  await new Promise(r => setTimeout(r, 800));
  document.getElementById('pageLoading').style.opacity = '0';
  setTimeout(() => document.getElementById('pageLoading').style.display = 'none', 400);
  document.getElementById('mainCard').style.display = 'block';

  if (mode !== 'resetPassword' || !oobCode) {
    showError('ลิงก์ไม่ถูกต้อง', 'ลิงก์นี้ไม่ถูกต้องหรือหมดอายุแล้ว<br>กรุณาขอลิงก์ Reset Password ใหม่อีกครั้งค่ะ');
    return;
  }

  try {
    await verifyPasswordResetCode(auth, oobCode);
    // Code valid — show form
  } catch(e) {
    showError('ลิงก์หมดอายุแล้ว', 'ลิงก์นี้ถูกใช้ไปแล้วหรือหมดอายุ<br>กรุณาขอลิงก์ Reset Password ใหม่อีกครั้งค่ะ');
  }
}

init();

function showError(title, sub) {
  document.getElementById('formState').style.display = 'none';
  document.getElementById('errorTitle').textContent = title;
  document.getElementById('errorSub').innerHTML = sub;
  document.getElementById('errorState').style.display = 'block';
}

window.checkStrength = () => {
  const val = document.getElementById('newPass').value;
  const fill = document.getElementById('strengthFill');
  const label = document.getElementById('strengthLabel');
  if (!val) { fill.style.width='0%'; label.textContent=''; return; }
  let score = 0;
  if (val.length >= 6) score++;
  if (val.length >= 10) score++;
  if (/[A-Z]/.test(val)) score++;
  if (/[0-9]/.test(val)) score++;
  if (/[^A-Za-z0-9]/.test(val)) score++;
  const levels = [
    { w:'20%', c:'#f87171', t:'อ่อนมาก' },
    { w:'40%', c:'#fb923c', t:'อ่อน' },
    { w:'60%', c:'#fbbf24', t:'ปานกลาง' },
    { w:'80%', c:'#a3e635', t:'แข็งแรง' },
    { w:'100%', c:'#4ade80', t:'แข็งแรงมาก 💪' },
  ];
  const lv = levels[Math.min(score-1, 4)];
  fill.style.width = lv.w;
  fill.style.background = lv.c;
  label.textContent = lv.t;
  label.style.color = lv.c;
};

window.toggleEye = (inputId, btnId) => {
  const inp = document.getElementById(inputId);
  const showing = inp.type === 'text';
  inp.type = showing ? 'password' : 'text';
  document.getElementById(btnId).textContent = showing ? '👁️' : '🙈';
};

window.doReset = async () => {
  const newPass = document.getElementById('newPass').value;
  const confirm = document.getElementById('confirmPass').value;
  const btn = document.getElementById('submitBtn');
  const msg = document.getElementById('msgEl');

  msg.className = 'msg';
  if (!newPass || !confirm) { msg.className='msg error'; msg.textContent='⚠️ กรุณากรอกรหัสผ่านให้ครบ'; return; }
  if (newPass.length < 6) { msg.className='msg error'; msg.textContent='⚠️ รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร'; return; }
  if (newPass !== confirm) { msg.className='msg error'; msg.textContent='⚠️ รหัสผ่านทั้งสองช่องไม่ตรงกัน'; return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>กำลังบันทึก...';

  try {
    await confirmPasswordReset(auth, oobCode, newPass);
    document.getElementById('formState').style.display = 'none';
    document.getElementById('successState').style.display = 'block';
  } catch(e) {
    msg.className = 'msg error';
    if (e.code === 'auth/expired-action-code') msg.textContent = '❌ ลิงก์หมดอายุแล้ว กรุณาขอใหม่';
    else if (e.code === 'auth/weak-password') msg.textContent = '❌ รหัสผ่านไม่ปลอดภัยพอ';
    else msg.textContent = '❌ ' + e.message;
    btn.disabled = false;
    btn.textContent = 'ตั้งรหัสผ่านใหม่ →';
  }
};
</script>
</body>
</html>
